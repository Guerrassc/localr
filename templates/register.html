<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join Localr</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="landing-body">

    <div class="landing-overlay"></div>

    <div class="landing-center">
        <div class="landing-hero">
            <p class="landing-eyebrow">Free. No credit card.</p>
            <h1 class="landing-title">Start finding<br><span class="accent">hidden gems</span>.</h1>
            <p class="landing-sub">Create an account to save places and build itineraries. Use a password of at least 10 characters.</p>
        </div>

        <div class="landing-form-wrap">
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}

            <form action="/register" method="POST" class="landing-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="username" placeholder="Choose a username" minlength="3" maxlength="32" pattern="[A-Za-z0-9_.\-]+" autocomplete="username" required />
                <input type="password" name="password" placeholder="Create a password (10+ characters)" minlength="10" maxlength="128" autocomplete="new-password" required />
                <button type="submit">Create free account</button>
            </form>

            <p class="landing-register">Already have an account? <a href="/login">Log in</a></p>
</div>
    </div>

</body>
</html>
