<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localr — AI-generated ideas for your next trip</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="landing-body">

    <!-- Overlay -->
    <div class="landing-overlay"></div>

    <!-- Main content -->
    <div class="landing-center">
        <div class="landing-hero">
            <p class="landing-eyebrow">AI-generated ideas for your next trip</p>
            <h1 class="landing-title">Find your next<br><span class="accent">hidden gem</span>.</h1>
            <p class="landing-sub">Pick a city and a mood. Localr asks an AI model for ideas and lets you swipe through them. Suggestions are AI-generated, so verify details before you go.</p>
        </div>

        <div class="landing-form-wrap">
            {% if error %}
            <p class="form-error">{{ error }}</p>
            {% endif %}

            <form action="/login" method="POST" class="landing-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="text" name="username" placeholder="Username" maxlength="32" autocomplete="username" required />
                <input type="password" name="password" placeholder="Password" maxlength="128" autocomplete="current-password" required />
                <button type="submit">Get started</button>
            </form>

            <p class="landing-register">New here? <a href="/register">Create a free account</a></p>
</div>
    </div>

</body>
</html>
